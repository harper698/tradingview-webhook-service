[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-webhook-service"
version = "1.0.0"
description = "Authenticated, idempotent TradingView alert receiver with a transactional mock executor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115.12,<1", "pydantic>=2.11,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
tv-webhook = "tv_webhook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
